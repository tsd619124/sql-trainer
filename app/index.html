<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SQL Lab">
<meta name="application-name" content="SQL Lab">
<meta name="sqltrain-version" content="4.0.0">
<meta name="sqltrain-build" content="20261026.9">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f3f5f9">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://api.github.com https://*.lcloud.cn https://*.leancloud.cn; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/app.svg">
<script type="module" src="./src/appearance.js"></script>
<title>SQL Lab · SQL 八周训练营</title>
</head>
<body>
<div id="sqltrain-root">
  <aside class="st-sidebar" aria-label="SQL 八周训练营">
    <div class="st-brand">
      <span class="st-brand-mark"><i data-lucide="code-xml" aria-hidden="true"></i></span>
      <div><div class="st-brand-name">SQL<span style="font-weight:400"> Lab</span></div><div class="st-brand-sub">八周训练营</div></div>
    </div>
    <div class="st-nav-label">学习空间</div>
    <div class="nav nav-pills" role="tablist" aria-label="训练系统导航" aria-orientation="vertical">
      <button class="nav-link active" id="tab-dash" role="tab" aria-controls="panel-dash" aria-selected="true" type="button"><span class="st-btn-ic"><i data-lucide="layout-dashboard" aria-hidden="true"></i>今天</span></button>
      <button class="nav-link" id="tab-train" role="tab" aria-controls="panel-train" aria-selected="false" type="button"><span class="st-btn-ic"><i data-lucide="dumbbell" aria-hidden="true"></i>训练</span></button>
      <button class="nav-link" id="tab-exam" role="tab" aria-controls="panel-exam" aria-selected="false" type="button"><span class="st-btn-ic"><i data-lucide="timer" aria-hidden="true"></i>测验</span></button>
      <button class="nav-link" id="tab-me" role="tab" aria-controls="panel-me" aria-selected="false" type="button"><span class="st-btn-ic"><i data-lucide="user" aria-hidden="true"></i>我的</span></button>
    </div>
    <div class="st-nav-label">常用工具</div>
    <div class="st-side-tools" aria-label="常用工具">
      <button type="button" data-act="open-q" data-qid="play"><i data-lucide="code-xml" aria-hidden="true"></i>自由练习</button>
      <button type="button" data-act="app-go" data-page="tpl"><i data-lucide="book-open" aria-hidden="true"></i>SQL 模板</button>
      <button type="button" data-act="app-go" data-page="schema"><i data-lucide="database" aria-hidden="true"></i>练习数据表</button>
    </div>
    <div class="st-sidebar-bottom">
      <div class="st-sidebar-course">
        <strong>把 SQL 练成业务能力</strong>
        <span class="text-muted" style="font-size:10px" id="st-course-meta">28 节微课 · 42 道真题</span>
        <div class="st-sidebar-progress-label"><span>学习进度</span><span id="st-sidebar-progress">0%</span></div>
        <div class="st-progress-track" id="st-course-progress" role="progressbar" aria-label="总体学习进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="st-progress-fill" id="st-sidebar-fill"></div></div>
      </div>
      <div class="st-save-status"><i data-lucide="hard-drive" aria-hidden="true"></i>学习进度自动保存<br>在「我的」中备份与同步</div>
    </div>
  </aside>
  <main class="st-main" id="st-main-content" tabindex="-1">
    <header class="st-topbar">
      <div class="st-header-leading">
        <button class="st-icon-button" id="st-app-back" data-act="app-back" type="button" aria-label="返回上一页" hidden><i data-lucide="chevron-left" aria-hidden="true"></i></button>
        <div class="st-header-copy"><span class="st-app-kicker" id="st-app-kicker">SQL Lab · 学习空间</span><strong id="st-breadcrumb-current">今天</strong></div>
      </div>
      <div class="st-topbar-status">
        <span class="st-engine" id="st-engine" data-mode="loading"><i data-lucide="database" aria-hidden="true"></i><span id="st-engine-text">正在准备练习库…</span></span>
        <button class="st-icon-button st-search-button" data-act="app-search" type="button" aria-label="搜索课程、题目与模板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>搜索课程、题目</span><kbd>⌘ K</kbd></button>
        <button class="st-icon-button st-focus-toggle" id="st-app-focus" data-act="app-focus" type="button" aria-label="进入专注练习" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><rect x="8" y="8" width="8" height="8" rx="2"/></svg><span>专注练习</span></button>
        <button class="st-avatar" data-act="app-go" data-page="me" type="button" aria-label="打开我的学习档案">SQL</button>
        <span class="st-kpi" id="st-streak">连续练习 0 天</span>
      </div>
    </header>
    <div id="st-ltitle" aria-hidden="true">总览</div>
    <div id="panel-dash" role="tabpanel" aria-labelledby="tab-dash"><div class="st-skel" aria-hidden="true"><div class="sk sk-focus"></div><div class="sk-row"><div class="sk sk-stat"></div><div class="sk sk-stat"></div><div class="sk sk-stat"></div><div class="sk sk-stat"></div></div><div class="sk sk-map"></div><div class="sk-row"><div class="sk sk-card"></div><div class="sk sk-card"></div></div></div></div>
    <div id="panel-train" role="tabpanel" aria-labelledby="tab-train" hidden>
      <div class="st-subseg" id="st-train-seg" role="group" aria-label="训练子页切换">
        <button type="button" class="on" data-sub="learn">学习</button>
        <button type="button" data-sub="practice">练习</button>
        <button type="button" data-sub="review">复习</button>
        <button type="button" data-sub="tpl">模板库</button>
        <button type="button" data-sub="schema">数据表</button>
      </div>
      <div id="panel-learn" role="tabpanel" aria-label="学习中心" hidden></div>
      <div id="panel-practice" role="tabpanel" aria-label="SQL 练习" hidden></div>
      <div id="panel-review" role="tabpanel" aria-label="间隔复习" hidden></div>

      <div id="panel-tpl" role="tabpanel" aria-label="模板库" hidden></div>
      <div id="panel-schema" role="tabpanel" aria-label="数据表" hidden></div>
    </div>
    <div id="panel-exam" role="tabpanel" aria-labelledby="tab-exam" hidden>
      <div class="st-subseg" id="st-exam-seg" role="group" aria-label="测验子页切换">
        <button type="button" class="on" data-sub="test">限时周测</button>
        <button type="button" data-sub="wrong">错题本</button>
      </div>
      <div id="panel-test" role="tabpanel" aria-label="限时周测" hidden></div>
      <div id="panel-wrong" role="tabpanel" aria-label="错题本" hidden></div>
    </div>
    <div id="panel-me" role="tabpanel" aria-labelledby="tab-me" hidden></div>
    <footer class="st-main-footer"><span>SQL 八周训练营 · 售前转型学习计划</span><span>Learn. Query. Understand.</span></footer>
  </main>
</div>


<div id="app-startup-status" role="alert" hidden></div>
<script src="/vendor/sql-wasm.js"></script>
<script src="/vendor/lucide.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
